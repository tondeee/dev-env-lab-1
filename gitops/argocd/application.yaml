apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: analytics-web-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tondeee/dev-env-lab-1.git
    targetRevision: feature/docker-workspace-lab3
    path: gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: analytics-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
